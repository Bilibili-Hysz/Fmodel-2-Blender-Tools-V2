[pytest]
# Only the test package belongs to the suite. Without this, `pytest` from the project
# root also collects backups/ (untracked recovery copies) and vendor/ (the bundled
# runtime), which are not tests and can make collection fail outright when a directory
# is unreadable for any reason.
testpaths = tests
norecursedirs =
    backups
    vendor
    _pipeline_tmp
    .pytest_cache
    .ruff_cache
    __pycache__
    .git
python_files = test_*.py
python_classes = *Tests
python_functions = test_*
